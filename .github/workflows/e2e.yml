# Click-through tests (Playwright, e2e/) against MARGEN TEST, on every push to main and pull request into it,
# every weekday morning, and on demand (Actions > E2E tests > Run workflow). Each failing test opens or updates a GitHub issue
# labelled "e2e" (e2e/github-issues-reporter.ts); the run's "playwright-report" download has the screenshots,
# videos and traces.
#
# Repository secrets it needs (Settings > Secrets and variables > Actions), all for MARGEN TEST, never PROD:
#   E2E_SUPABASE_URL, E2E_SUPABASE_PUBLISHABLE_KEY   the TEST project, as in .env.local
#   E2E_ADMIN_PASSWORD, E2E_FACTORY_PASSWORD, E2E_CLIENT_PASSWORD   as in .env.e2e
name: E2E tests

on:
  push:
    branches: [main]
  # Changes waiting in a pull request are tested too, before they reach main (and the live site).
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# The runs share the test accounts and records, so only one at a time.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_ADMIN_EMAIL: e2e.admin@example.com
      E2E_FACTORY_EMAIL: e2e.factory@example.com
      E2E_CLIENT_EMAIL: e2e.client@example.com
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_FACTORY_PASSWORD: ${{ secrets.E2E_FACTORY_PASSWORD }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
