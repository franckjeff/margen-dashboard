<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARGEN Dashboard</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Brand typefaces: Exo 2 for headings, Open Sans for body copy. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600&family=Open+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme, or the system's, before the page paints (app.js handles the switch).
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("margen-theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div id="app"><p class="loading">Loading…</p></div>
  <script type="module" src="app.js"></script>
</body>
</html>
